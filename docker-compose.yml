name: teaching

services:
  postgres:
    image: postgres:17.11
    container_name: teaching-postgres
    environment:
      POSTGRES_DB: teaching
      POSTGRES_USER: teaching
      POSTGRES_PASSWORD: teaching
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teaching -d teaching"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: teaching-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:21.0.0
    container_name: teaching-phoenix
    environment:
      PHOENIX_HOST: 0.0.0.0
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_DISABLE_AGENT_ASSISTANT: "true"
      PHOENIX_WORKING_DIR: /data
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenixdata:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  phoenixdata:
