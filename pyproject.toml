[project]
name = "network-agent"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

dependencies = [
    "agentscope[memory-reme,service,storage-redis]==2.0.11",
    "fastapi[standard]==0.162.0",
    "sqlmodel==0.0.48",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "redis==8.1.0",
    "pillow==13.0.0",
    "python-multipart==0.0.33",
    "python-frontmatter==1.3.0",
    "pyjwt>=2.15.1",
    "cos-python-sdk-v5==1.9.44",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    # >=0.4.1.12 移除了 dream_topics_step, 与 agentscope 2.0.11 的内嵌配置不兼容
    "reme-ai==0.4.1.11",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
    "ty==0.0.96",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "RUF",
    "SIM",
    "ARG",
]
